[project]
name = "ha-cloudflare-access-relay"
version = "0.1.0"
description = "Cloudflare Access relay for the Home Assistant companion app"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "RUF"]
ignore = ["D203", "D213", "E501", "D107", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.cloudflare_access_relay"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
files = ["custom_components/cloudflare_access_relay"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["homeassistant.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
