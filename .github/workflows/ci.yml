name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q --timeout=300

  live:
    # Real Cloudflare: deploys a throwaway echo Worker on workers.dev and a run-scoped
    # service token, sets the integration up through Home Assistant against that host,
    # proves the edge behaviour the integration depends on (tests/live), deletes both.
    # Skipped when the two secrets are absent (forks).
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    concurrency: live-cloudflare
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q --timeout=600 -rs -o log_level=WARNING tests/live
      - if: always()
        run: uv run python -m tests.live.cleanup --stale

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    # Non-blocking until the repository is ready for HACS publication: the action
    # requires a repository description, topics and a LICENSE file.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
