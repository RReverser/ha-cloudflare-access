name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pinned
            allow_failure: false
          - name: latest
            allow_failure: true
    continue-on-error: ${{ matrix.allow_failure }}
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Move to the latest Home Assistant release
        if: matrix.name == 'latest'
        run: |
          uv pip install --upgrade homeassistant pytest-homeassistant-custom-component
          reqs=$(uv run python -c "import json, pathlib, homeassistant.components.frontend as f; print(' '.join(json.loads((pathlib.Path(f.__file__).parent / 'manifest.json').read_text())['requirements']))")
          uv pip install $reqs
          uv run python -c "import homeassistant.const as c; print('home assistant', c.__version__)"
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q --timeout=300

  live:
    # Real Cloudflare: creates a run-scoped service token, sets the integration up
    # through Home Assistant against the test host, proves the edge behaviour the
    # relay depends on (tests/live), deletes the token. Skipped when the two secrets
    # are absent (forks).
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    concurrency: live-cloudflare
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_TEST_HOST: test-host.example.com
      CF_TEST_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q --timeout=600 -rs tests/live

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    # Non-blocking until the repository is ready for HACS publication: the action
    # requires a repository description, topics and a LICENSE file.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
